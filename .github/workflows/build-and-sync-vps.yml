name: Build Mobile Apps (Android APK & iOS IPA) and Sync to VPS

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target Environment (production, staging, development)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - development
      build_target:
        description: 'Target Mobile Platforms to Build'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - android
          - ios
      sync_to_vps:
        description: 'Sync built APK/IPA artifacts to VPS downloads folder (default false)'
        required: true
        type: boolean
        default: false
      publish_release:
        description: 'Publish compiled APK & IPA to GitHub Releases'
        required: true
        type: boolean
        default: true
      release_version:
        description: 'Custom Release Version Tag (e.g. v1.4.1, leave blank for auto v1.4.0-b<run>)'
        required: false
        default: ''
        type: string
      release_notes:
        description: 'Keterangan perbaikan bug / Catatan rilis kustom (opsional)'
        required: false
        default: ''
        type: string
      is_prerelease:
        description: 'Mark release as pre-release / beta'
        required: false
        type: boolean
        default: false
      pocketbase_url:
        description: 'PocketBase backend URL override (e.g. https://pb.example.com)'
        required: false
        default: ''
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'docs/**'
      - '.scratch/**'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_SLUG: 'applyflow'

jobs:
  # ========================================================
  # JOB 1: Build Android APK (Debug & Sideload Ready)
  # ========================================================
  build-android:
    name: Build Android APK
    if: ${{ github.event_name == 'push' || inputs.build_target == 'both' || inputs.build_target == 'android' }}
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      SYNC_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_to_vps == true }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Test Verification
        run: npm test

      - name: Build Web Application
        env:
          VITE_POCKETBASE_URL: ${{ inputs.pocketbase_url || vars.VITE_POCKETBASE_URL || secrets.VITE_POCKETBASE_URL || '' }}
        run: npm run build

      - name: Sync Capacitor Android Platform
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Compile Android APK with Retry Logic
        working-directory: android
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Attempt $attempt: Compiling Android APK (assembleDebug)..."
            if ./gradlew assembleDebug --stacktrace --no-daemon; then
              echo "Android APK compile succeeded on attempt $attempt."
              break
            elif [ "$attempt" -eq 3 ]; then
              echo "::error::Android APK compile failed after 3 attempts."
              exit 1
            fi
            echo "Attempt $attempt encountered a transient error. Retrying in 5 seconds..."
            sleep 5
          done

      - name: Prepare APK Outputs
        run: |
          mkdir -p dist-mobile
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-mobile/${{ env.APP_SLUG }}-android-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-mobile/${{ env.APP_SLUG }}-latest.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-mobile/app-latest.apk
          echo "APK outputs prepared:"
          ls -lh dist-mobile/

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_SLUG }}-android-apk
          path: dist-mobile/*.apk
          retention-days: 14

      - name: Android APK Build Summary
        run: |
          echo "### Android APK Build Status :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "- **Application Name**: ApplyFlow" >> $GITHUB_STEP_SUMMARY
          echo "- **Package ID**: \`com.applyflow.app\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Flavor**: Debug APK (Sideload / Testing Ready)" >> $GITHUB_STEP_SUMMARY
          echo "- **Primary Artifact**: \`${{ env.APP_SLUG }}-android-debug.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Latest Alias**: \`${{ env.APP_SLUG }}-latest.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Target SDK**: Android 14 (API 34) / Min SDK 22 (Android 5.1+)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Cara Pasang di HP Android:" >> $GITHUB_STEP_SUMMARY
          echo "1. Unduh \`${{ env.APP_SLUG }}-android-debug.apk\` dari bagian Artifacts di atas." >> $GITHUB_STEP_SUMMARY
          echo "2. Salin ke HP atau jalankan: \`adb install -r ${{ env.APP_SLUG }}-latest.apk\`" >> $GITHUB_STEP_SUMMARY

      - name: Transfer APK to VPS via SSH & SCP
        if: ${{ env.SYNC_ENABLED == 'true' && env.VPS_HOST != '' && env.VPS_SSH_KEY != '' }}
        continue-on-error: true
        env:
          VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USERNAME || secrets.VPS_USERNAME || 'ubuntu' }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ vars.VPS_SSH_PORT || secrets.VPS_SSH_PORT || vars.VPS_PORT || secrets.VPS_PORT || '2222' }}
          VPS_TARGET: ${{ vars.VPS_TARGET_DIR || secrets.VPS_TARGET_DIR || '/srv/www/applyflow/downloads' }}
        run: |
          set -euo pipefail

          TARGET_PORT="$VPS_PORT"
          if ! nc -z -w 3 "$VPS_HOST" "$TARGET_PORT" 2>/dev/null; then
            if nc -z -w 3 "$VPS_HOST" 2222 2>/dev/null; then
              TARGET_PORT=2222
            elif nc -z -w 3 "$VPS_HOST" 22 2>/dev/null; then
              TARGET_PORT=22
            fi
          fi
          echo "Target VPS SSH port: $TARGET_PORT"

          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$TARGET_PORT" -H "$VPS_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null || true
          chmod 600 "$HOME/.ssh/known_hosts"
          STRICT_OPT="-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$HOME/.ssh/known_hosts"

          echo "Menguji konektivitas SSH ke VPS ($VPS_HOST:$TARGET_PORT)..."
          if ! ssh -o BatchMode=yes -o ConnectTimeout=10 $STRICT_OPT -p "$TARGET_PORT" -i "$HOME/.ssh/id_ed25519" "$VPS_USER@$VPS_HOST" "echo SSH_CONNECTION_OK" 2>/dev/null; then
            echo "::warning::Koneksi SSH ke VPS ($VPS_HOST:$TARGET_PORT) ditolak atau firewall aktif. File APK tetap aman tersimpan di GitHub Artifacts."
            rm -f "$HOME/.ssh/id_ed25519"
            exit 0
          fi

          echo "Memastikan direktori tujuan di VPS: $VPS_TARGET"
          ssh -o BatchMode=yes -o ConnectTimeout=20 $STRICT_OPT -p "$TARGET_PORT" -i "$HOME/.ssh/id_ed25519" "$VPS_USER@$VPS_HOST" \
            "mkdir -p '$VPS_TARGET' 2>/dev/null || (sudo -n mkdir -p '$VPS_TARGET' && sudo -n chown -R $VPS_USER:$VPS_USER '$VPS_TARGET' && chmod 755 '$VPS_TARGET')" || true

          echo "Mentransfer APK ke VPS..."
          scp -o BatchMode=yes -o ConnectTimeout=20 $STRICT_OPT -P "$TARGET_PORT" -i "$HOME/.ssh/id_ed25519" dist-mobile/${{ env.APP_SLUG }}-latest.apk "$VPS_USER@$VPS_HOST:$VPS_TARGET/${{ env.APP_SLUG }}-latest.apk"
          scp -o BatchMode=yes -o ConnectTimeout=20 $STRICT_OPT -P "$TARGET_PORT" -i "$HOME/.ssh/id_ed25519" dist-mobile/app-latest.apk "$VPS_USER@$VPS_HOST:$VPS_TARGET/app-latest.apk"
          ssh -o BatchMode=yes -o ConnectTimeout=20 $STRICT_OPT -p "$TARGET_PORT" -i "$HOME/.ssh/id_ed25519" "$VPS_USER@$VPS_HOST" \
            "chmod 644 '$VPS_TARGET/${{ env.APP_SLUG }}-latest.apk' '$VPS_TARGET/app-latest.apk'" || true
          echo "✓ Android APK berhasil ditransfer ke $VPS_TARGET/${{ env.APP_SLUG }}-latest.apk"
          rm -f "$HOME/.ssh/id_ed25519"

      - name: Ensure SSH Key Cleanup on Android Job
        if: always()
        run: |
          rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts" 2>/dev/null || true

  # ========================================================
  # JOB 2: Build iOS IPA (Unsigned Package for Sideload / AltStore)
  # ========================================================
  build-ios:
    name: Build iOS IPA
    if: ${{ github.event_name == 'push' || inputs.build_target == 'both' || inputs.build_target == 'ios' }}
    runs-on: macos-14
    continue-on-error: true
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      SYNC_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_to_vps == true }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Test Verification
        run: npm test

      - name: Build Web Application
        env:
          VITE_POCKETBASE_URL: ${{ inputs.pocketbase_url || vars.VITE_POCKETBASE_URL || secrets.VITE_POCKETBASE_URL || '' }}
        run: npm run build

      - name: Sync Capacitor iOS Platform
        run: npx cap sync ios

      - name: Compile and Build iOS App (Unsigned)
        run: |
          mkdir -p build/DerivedData
          if [ -d "ios/App/App.xcworkspace" ]; then
            TARGET_FLAG="-workspace ios/App/App.xcworkspace"
          else
            TARGET_FLAG="-project ios/App/App.xcodeproj"
          fi
          echo "Compiling Xcode project with $TARGET_FLAG..."
          xcodebuild $TARGET_FLAG \
                     -scheme App \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build/DerivedData \
                     build \
                     CODE_SIGN_STYLE=Manual \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     DEVELOPMENT_TEAM="" \
                     CODE_SIGN_ENTITLEMENTS="" \
                     CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO

      - name: Extract Payload and Package IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "::error::Could not find compiled .app in DerivedData!"
            exit 1
          fi
          echo "Found compiled iOS app bundle at: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r ../${{ env.APP_SLUG }}-ios-unsigned.ipa Payload
          cp ../${{ env.APP_SLUG }}-ios-unsigned.ipa ../${{ env.APP_SLUG }}-latest.ipa
          cp ../${{ env.APP_SLUG }}-ios-unsigned.ipa ../app-latest.ipa
          cd ..
          echo "iOS IPA packaged:"
          ls -lh ${{ env.APP_SLUG }}-ios-unsigned.ipa

      - name: Upload iOS IPA Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_SLUG }}-ios-ipa
          path: |
            ${{ env.APP_SLUG }}-ios-unsigned.ipa
            ${{ env.APP_SLUG }}-latest.ipa
          retention-days: 14

      - name: iOS IPA Build Summary
        run: |
          echo "### iOS IPA Build Status :apple:" >> $GITHUB_STEP_SUMMARY
          echo "- **Application Name**: ApplyFlow" >> $GITHUB_STEP_SUMMARY
          echo "- **Bundle ID**: \`com.applyflow.app\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Signing Status**: Unsigned archive" >> $GITHUB_STEP_SUMMARY
          echo "- **Primary Artifact**: \`${{ env.APP_SLUG }}-ios-unsigned.ipa\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Latest Alias**: \`${{ env.APP_SLUG }}-latest.ipa\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Cara Pasang di iPhone / iPad:" >> $GITHUB_STEP_SUMMARY
          echo "1. Unduh file \`${{ env.APP_SLUG }}-ios-unsigned.ipa\` dari GitHub Artifacts." >> $GITHUB_STEP_SUMMARY
          echo "2. Install menggunakan **AltStore**, **Sideloadly**, **TrollStore**, atau **Scarlet** dengan Apple ID pribadi Anda." >> $GITHUB_STEP_SUMMARY

      - name: Transfer IPA to VPS via SSH & SCP
        if: ${{ env.SYNC_ENABLED == 'true' && env.VPS_HOST != '' && env.VPS_SSH_KEY != '' }}
        continue-on-error: true
        env:
          VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USERNAME || secrets.VPS_USERNAME || 'ubuntu' }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ vars.VPS_SSH_PORT || secrets.VPS_SSH_PORT || vars.VPS_PORT || secrets.VPS_PORT || '2222' }}
          VPS_TARGET: ${{ vars.VPS_TARGET_DIR || secrets.VPS_TARGET_DIR || '/srv/www/applyflow/downloads' }}
        run: |
          set -euo pipefail

          TARGET_PORT="$VPS_PORT"
          if ! nc -z -w 3 "$VPS_HOST" "$TARGET_PORT" 2>/dev/null; then
            if nc -z -w 3 "$VPS_HOST" 2222 2>/dev/null; then
              TARGET_PORT=2222
            elif nc -z -w 3 "$VPS_HOST" 22 2>/dev/null; then
              TARGET_PORT=22
            fi
          fi
          echo "Target VPS SSH port: $TARGET_PORT"

          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$TARGET_PORT" -H "$VPS_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null || true
          chmod 600 "$HOME/.ssh/known_hosts"
          STRICT_OPT="-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$HOME/.ssh/known_hosts"

          echo "Menguji konektivitas SSH ke VPS ($VPS_HOST:$TARGET_PORT)..."
          if ! ssh -o BatchMode=yes -o ConnectTimeout=10 $STRICT_OPT -p "$TARGET_PORT" -i "$HOME/.ssh/id_ed25519" "$VPS_USER@$VPS_HOST" "echo SSH_CONNECTION_OK" 2>/dev/null; then
            echo "::warning::Koneksi SSH ke VPS ($VPS_HOST:$TARGET_PORT) ditolak atau firewall aktif. File IPA tetap aman tersimpan di GitHub Artifacts."
            rm -f "$HOME/.ssh/id_ed25519"
            exit 0
          fi

          echo "Memastikan direktori tujuan di VPS: $VPS_TARGET"
          ssh -o BatchMode=yes -o ConnectTimeout=20 $STRICT_OPT -p "$TARGET_PORT" -i "$HOME/.ssh/id_ed25519" "$VPS_USER@$VPS_HOST" \
            "mkdir -p '$VPS_TARGET' 2>/dev/null || (sudo -n mkdir -p '$VPS_TARGET' && sudo -n chown -R $VPS_USER:$VPS_USER '$VPS_TARGET' && chmod 755 '$VPS_TARGET')" || true

          echo "Mentransfer IPA ke VPS..."
          scp -o BatchMode=yes -o ConnectTimeout=20 $STRICT_OPT -P "$TARGET_PORT" -i "$HOME/.ssh/id_ed25519" ${{ env.APP_SLUG }}-latest.ipa "$VPS_USER@$VPS_HOST:$VPS_TARGET/${{ env.APP_SLUG }}-latest.ipa"
          scp -o BatchMode=yes -o ConnectTimeout=20 $STRICT_OPT -P "$TARGET_PORT" -i "$HOME/.ssh/id_ed25519" app-latest.ipa "$VPS_USER@$VPS_HOST:$VPS_TARGET/app-latest.ipa"
          ssh -o BatchMode=yes -o ConnectTimeout=20 $STRICT_OPT -p "$TARGET_PORT" -i "$HOME/.ssh/id_ed25519" "$VPS_USER@$VPS_HOST" \
            "chmod 644 '$VPS_TARGET/${{ env.APP_SLUG }}-latest.ipa' '$VPS_TARGET/app-latest.ipa'" || true
          echo "✓ iOS IPA berhasil ditransfer ke $VPS_TARGET/${{ env.APP_SLUG }}-latest.ipa"
          rm -f "$HOME/.ssh/id_ed25519"

      - name: Ensure SSH Key Cleanup on iOS Job
        if: always()
        run: |
          rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts" 2>/dev/null || true

  # ========================================================
  # JOB 3: Publish GitHub Release (APK & IPA Assets)
  # ========================================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-ios]
    if: |
      always() &&
      (needs.build-android.result == 'success' || needs.build-ios.result == 'success') &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release != false))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source Code (Full Git History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create Release Asset Directories
        run: |
          mkdir -p release-assets/android release-assets/ios release-files

      - name: Download Android APK Artifacts
        if: ${{ needs.build-android.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_SLUG }}-android-apk
          path: release-assets/android
        continue-on-error: true

      - name: Download iOS IPA Artifacts
        if: ${{ needs.build-ios.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_SLUG }}-ios-ipa
          path: release-assets/ios
        continue-on-error: true

      - name: Generate Release Notes and Organize Binaries
        id: release_meta
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          INPUT_RELEASE_VERSION: ${{ inputs.release_version || '' }}
          INPUT_RELEASE_NOTES: ${{ inputs.release_notes || '' }}
          INPUT_IS_PRERELEASE: ${{ inputs.is_prerelease || 'false' }}
        run: |
          node scripts/generate-release-notes.mjs
          echo "Release metadata generated successfully."
          echo "Files in release-files/:"
          ls -lh release-files/

      - name: Publish GitHub Release via softprops/action-gh-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_title }}
          body_path: release-body.md
          draft: false
          prerelease: ${{ steps.release_meta.outputs.is_prerelease == 'true' }}
          files: |
            release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Publication Summary
        if: always()
        run: |
          echo "### GitHub Release Published Successfully :package:" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Tag**: \`${{ steps.release_meta.outputs.tag_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Title**: \`${{ steps.release_meta.outputs.release_title }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Android Status**: \`${{ needs.build-android.result }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **iOS Status**: \`${{ needs.build-ios.result }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Berkas APK dan IPA telah otomatis diunggah ke GitHub Releases dan siap diunduh oleh pengguna!" >> $GITHUB_STEP_SUMMARY
