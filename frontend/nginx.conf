limit_req_zone $binary_remote_addr zone=auth_requests:10m rate=10r/m;

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  limit_req_status 429;
  location = /api/collections/users/auth-with-password {
    limit_req zone=auth_requests burst=5 nodelay;
    proxy_pass http://pocketbase:8090/api/collections/users/auth-with-password;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location = /api/collections/users/request-password-reset {
    limit_req zone=auth_requests burst=3 nodelay;
    proxy_pass http://pocketbase:8090/api/collections/users/request-password-reset;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location = /api/junction/telegram {
    limit_req zone=auth_requests burst=3 nodelay;
    proxy_pass http://pocketbase:8090/api/junction/telegram;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /api/ {
    proxy_pass http://pocketbase:8090/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location / { try_files $uri $uri/ /index.html; }
}
